[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invaria"
version = "0.1.0"
description = "Invaria — Universal LLM Context Compiler"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Supratim Ghosh", email = "sgindeed234@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
openai = [
    "openai>=1.0.0"
]
anthropic = [
    "anthropic>=0.18.0"
]
google = [
    "google-genai>=0.3.0"
]
cli = [
    "typer>=0.9.0"
]
test = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "pytest-asyncio>=0.21.0"
]

[project.urls]
Homepage = "https://github.com/sgindeed/invaria"
Repository = "https://github.com/sgindeed/invaria"

[project.scripts]
invaria = "invaria.cli.main:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["src/invaria"]